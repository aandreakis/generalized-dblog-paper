\* Invariant run: read-only executed-set brackets on a small,
\* non-trivial configuration (3 keys in 2 chunks, up to 4 data events
\* in transactions of up to 2 events, deletes included; lawful
\* boundary-only sampling).  Expected verdict: every invariant holds.
SPECIFICATION Spec
CONSTANTS
  NULL = NULL
  MaxEvents = 4
  MaxTxnSize = 2
  BoundarySampling = TRUE
  UncommittedProbe = FALSE
  Keys <- MainKeys
  Vals <- MainVals
  ChunkDoms <- MainChunkDoms
INVARIANTS
  TypeOK
  CommittedOnly
  OracleFaithful
  FrontierExact
  ContinuationExact
  PerKeyMonotone
CHECK_DEADLOCK FALSE
