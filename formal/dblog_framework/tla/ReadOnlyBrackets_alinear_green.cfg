\* A-LINEAR PROBE, lawful control: the probe configuration (one key,
\* one chunk, up to two events, transactions of up to two events) with
\* boundary-only sampling (BoundarySampling = TRUE).  Expected
\* verdict: every invariant holds.  The contrast partner of the two
\* off-boundary runs.
SPECIFICATION Spec
CONSTANTS
  NULL = NULL
  MaxEvents = 2
  MaxTxnSize = 2
  BoundarySampling = TRUE
  UncommittedProbe = FALSE
  Keys <- AlinKeys
  Vals <- AlinVals
  ChunkDoms <- AlinChunkDoms
INVARIANTS
  TypeOK
  CommittedOnly
  OracleFaithful
  FrontierExact
  ContinuationExact
  PerKeyMonotone
CHECK_DEADLOCK FALSE
