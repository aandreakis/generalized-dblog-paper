\* A-LINEAR PROBE, replay facet (model-level audit content;
\* owner-ruled addendum 2026-08-08; expectation corrected at the
\* fidelity round).  Same malformed interior-prefix denotation as
\* ReadOnlyBrackets_alinear_oracle.cfg, with FrontierExact checked.
\* EXPECTED TO HOLD: the window-discard replay is robust to the
\* denotation violation alone.  A surviving key's verdict is
\* boundary-honest (A-read binds in both modes), and window
\* invariance forces it to the frontier value; the events that the
\* oracle mis-classifies as pre-window all precede the read's
\* boundary witness, so no stale survivor arises.  All transactions
\* remain atomic and all reads remain boundary-honest.
